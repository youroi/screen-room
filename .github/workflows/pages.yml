name: Publish catalogue

on:
  push:
    branches: [main]
    paths: [public/**, scripts/**, .github/workflows/pages.yml]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh TMDB catalogue before publishing
        type: boolean
        default: true

concurrency:
  group: still-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: .published
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh and retain the validated snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          node scripts/refresh-catalogue.mjs .published/catalogue-snapshot.json
          git -C .published add catalogue-snapshot.json
          git -C .published -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh catalogue snapshot'
          git -C .published push origin HEAD:gh-pages
      - name: Include the last validated snapshot
        run: |
          if test -f .published/catalogue-snapshot.json; then
            cp .published/catalogue-snapshot.json public/catalogue-snapshot.json
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
