<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser audio · Screen Room</title>
  <link rel="stylesheet" href="./style.css?v=6">
  <script type="module" src="./browser-audio.js"></script>
</head>
<body>
  <main class="shell" tabindex="-1">
    <h1>Browser audio</h1>
    <div class="player"><video preload="metadata" playsinline></video></div>
    <div class="playback-options"><button class="button primary" type="button">Play with browser audio</button></div>
    <p id="audio-status" class="muted" role="status"></p>
  </main>

</html>
